# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Aliyun

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    environment: GithubAction
    env:
      HUGO_VERSION: 0.147.7
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify
  # Deployment job
      - name: deploy-to-aliyun
        env:
          ALIYUNID: ${{ secrets.ALIYUNID }}
          ALIYUNKEY: ${{ secrets.ALIYUNKEY }}
          ALIYUNBUCKET: ${{ secrets.ALIYUNBUCKET }}
          ALIYUN_REGION: cn-shenzhen
          LOCAL_DIR: ./public/
          REMOTE_DIR: /
        run: |
          wget -O ${{ runner.temp }}/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip || { echo "Download failed"; exit 1; }
          unzip -o ${{ runner.temp }}/ossutil.zip -d ${{ runner.temp }}/ossutil-dir || { echo "Extracting failed"; exit 1; }
          OSSUTIL=$(find ${{ runner.temp }}/ossutil-dir -type f -name ossutil | head -n 1)
          chmod +x "${OSSUTIL}" || { echo "Permission setting failed"; exit 1; }
          echo "${ALIYUNBUCKET} is operating"
          ${OSSUTIL} -i ${ALIYUNID} -k ${ALIYUNKEY} --region ${ALIYUN_REGION} ls oss://${ALIYUNBUCKET}
          ${OSSUTIL} -i ${ALIYUNID} -k ${ALIYUNKEY} --region ${ALIYUN_REGION} sync --delete ${LOCAL_DIR} oss://${ALIYUNBUCKET}${REMOTE_DIR}
          echo 'Finished.'
